<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="1060" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionStream - Publish, fan-out and back-pressure</text>
  <text class="subtitle" x="40" y="78">One Publish call is sequenced and retained once, then offered to each subscriber's bounded buffer under its FullBufferPolicy.</text>

  <!-- entry -->
  <rect class="step" x="40" y="104" width="320" height="70" rx="14"/>
  <text class="code" x="200" y="134" text-anchor="middle">Publish(topic, evt)</text>
  <text class="small" x="200" y="157" text-anchor="middle">Publish records +1 orion.stream.published</text>

  <path class="flow" d="M200,174 L200,208"/>
  <polygon class="decision" points="200,210 310,260 200,310 90,260"/>
  <text class="label" x="200" y="256" text-anchor="middle">Replay on</text>
  <text class="small" x="200" y="275" text-anchor="middle">for this topic?</text>

  <!-- no replay: topic must exist -->
  <path class="flow" d="M310,260 L388,260"/>
  <text class="edge" x="349" y="250" text-anchor="middle">no</text>
  <polygon class="decision" points="480,215 570,260 480,305 390,260"/>
  <text class="label" x="480" y="265" text-anchor="middle">Topic exists?</text>
  <path class="flow" d="M570,260 L648,260"/>
  <text class="edge" x="609" y="250" text-anchor="middle">no</text>
  <rect class="ok" x="650" y="232" width="170" height="56" rx="14"/>
  <text class="label" x="735" y="257" text-anchor="middle">Return 0</text>
  <text class="small" x="735" y="276" text-anchor="middle">nothing to deliver</text>
  <path class="flow" d="M480,305 L480,400 L342,400"/>
  <text class="edge" x="488" y="345">yes</text>

  <!-- under the lock -->
  <path class="flow" d="M200,310 L200,358"/>
  <text class="edge" x="192" y="340" text-anchor="end">yes: get or create topic</text>
  <rect class="step" x="60" y="360" width="280" height="80" rx="14"/>
  <text class="label" x="200" y="387" text-anchor="middle">Under the topic lock</text>
  <text class="small" x="200" y="407" text-anchor="middle">sequence + 1, stamp a per-delivery copy</text>
  <text class="code" x="200" y="428" text-anchor="middle">IReplayStore.Append(entry)</text>

  <path class="flow alt" d="M340,425 L648,425"/>
  <text class="edge" x="494" y="443" text-anchor="middle">store error (for example Redis)</text>
  <rect class="fail" x="650" y="395" width="300" height="60" rx="14"/>
  <text class="label" x="800" y="420" text-anchor="middle">Publish throws</text>
  <text class="small" x="800" y="441" text-anchor="middle">no subscriber receives the event</text>

  <!-- per subscriber frame -->
  <rect class="note" x="40" y="470" width="1140" height="460" rx="14"/>
  <text class="small" x="230" y="494">For each subscriber of the topic, still inside the topic lock</text>

  <path class="flow" d="M200,440 L200,518"/>
  <polygon class="decision" points="200,520 310,570 200,620 90,570"/>
  <text class="label" x="200" y="575" text-anchor="middle">Filter accepts?</text>
  <path class="flow" d="M310,570 L358,570"/>
  <text class="edge" x="334" y="560" text-anchor="middle">no</text>
  <rect class="note" x="360" y="542" width="230" height="56" rx="10"/>
  <text class="label" x="475" y="566" text-anchor="middle">Skip</text>
  <text class="small" x="475" y="586" text-anchor="middle">not delivered, not dropped</text>

  <path class="flow" d="M200,620 L200,648"/>
  <text class="edge" x="210" y="640">yes</text>
  <polygon class="decision" points="200,650 310,700 200,750 90,700"/>
  <text class="label" x="200" y="705" text-anchor="middle">Buffer full?</text>

  <path class="flow" d="M200,750 L200,788"/>
  <text class="edge" x="210" y="774">no</text>
  <rect class="ok" x="80" y="790" width="240" height="60" rx="14"/>
  <text class="label" x="200" y="816" text-anchor="middle">Enqueue</text>
  <text class="small" x="200" y="836" text-anchor="middle">counts as delivered</text>

  <path class="flow" d="M310,700 L378,700"/>
  <text class="edge" x="344" y="690" text-anchor="middle">yes</text>
  <polygon class="decision" points="470,650 560,700 470,750 380,700"/>
  <text class="code" x="470" y="705" text-anchor="middle">FullBufferPolicy</text>

  <!-- policies -->
  <path class="flow" d="M470,650 L470,610 L608,610"/>
  <path class="flow" d="M560,700 L608,700"/>
  <path class="flow" d="M470,750 L470,804 L608,804"/>

  <rect class="step" x="610" y="577" width="270" height="66" rx="14"/>
  <text class="label" x="745" y="603" text-anchor="middle">DropOldest (default)</text>
  <text class="small" x="745" y="624" text-anchor="middle">evict oldest, enqueue: delivered, dropped</text>

  <rect class="fail" x="610" y="667" width="270" height="66" rx="14"/>
  <text class="label" x="745" y="693" text-anchor="middle">DropNewest</text>
  <text class="small" x="745" y="714" text-anchor="middle">discard the incoming event: dropped</text>

  <rect class="step" x="610" y="758" width="270" height="92" rx="14"/>
  <text class="label" x="745" y="783" text-anchor="middle">Wait</text>
  <text class="small" x="745" y="803" text-anchor="middle">block up to MaxPublishWait for room</text>
  <text class="small" x="745" y="821" text-anchor="middle">room: delivered; timeout: dropped</text>
  <text class="small" x="745" y="839" text-anchor="middle">Publish is blocked, lock held</text>

  <!-- slow consumer -->
  <path class="flow" d="M880,610 L1010,610 L1010,640"/>
  <path class="flow" d="M880,700 L908,700"/>
  <path class="flow" d="M880,804 L1010,804 L1010,760"/>
  <polygon class="decision" points="1010,642 1110,700 1010,758 910,700"/>
  <text class="small" x="1010" y="689" text-anchor="middle">SlowConsumerPolicy:</text>
  <text class="small" x="1010" y="705" text-anchor="middle">full on N publishes</text>
  <text class="small" x="1010" y="721" text-anchor="middle">in a row?</text>

  <path class="flow alt" d="M1110,700 L1140,700 L1140,838"/>
  <text class="edge" x="1146" y="770">yes</text>
  <rect class="fail" x="960" y="840" width="200" height="64" rx="14"/>
  <text class="label" x="1060" y="866" text-anchor="middle">Disconnect</text>
  <text class="small" x="1060" y="886" text-anchor="middle">channel completed, removed</text>

  <!-- end -->
  <path class="flow" d="M600,930 L600,958"/>
  <text class="edge" x="612" y="952">after the last subscriber</text>
  <rect class="ok" x="300" y="960" width="600" height="70" rx="14"/>
  <text class="label" x="600" y="988" text-anchor="middle">Publish returns the delivered count</text>
  <text class="small" x="600" y="1010" text-anchor="middle">and adds the dropped count to orion.stream.dropped once, when it is above 0</text>
</svg>
