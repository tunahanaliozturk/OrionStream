name: Bug report
description: Something in an OrionStream package does not behave the way its documentation says.
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the package, the version, the target framework and a minimal repro. Without
        those four the first reply is always a request for them, which costs both of us a round trip.

        If the bug has security implications, do not file it here. Report it privately as described in
        [SECURITY.md](https://github.com/tunahanaliozturk/OrionStream/blob/main/SECURITY.md).

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: The package the bug is in. Pick the one whose code misbehaves, not the one you happened to call.
      options:
        - OrionStream
        - OrionStream.Redis
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: The exact version from your PackageReference, for example 0.7.0. "latest" is not a version.
      placeholder: "0.7.0"
    validations:
      required: true

  - type: dropdown
    id: tfm
    attributes:
      label: Target framework
      options:
        - net8.0
        - net9.0
        - net10.0
        - Other (say which in the repro)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest code that shows the problem: ideally one file, one method, under 50 lines,
        including the DI registrations and the StreamOptions you set. Paste code, not a screenshot. A
        link to a repo is welcome as well as, not instead of, the snippet.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the documentation or the XML docs led you to expect, and where they say it.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The actual behaviour. Include the full exception and stack trace if one is thrown.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `dotnet --info`, plus the OS, any proxy or load balancer in front of the SSE endpoint, the browser if it matters, and for OrionStream.Redis the Redis version.
      render: text
    validations:
      required: false
